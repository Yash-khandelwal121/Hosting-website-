<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nesticGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feFlood flood-color="#3B82F6" flood-opacity="0.5" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <g filter="url(#neonGlow)">
    <path d="M30 10L52 22V38L30 50L8 38V22L30 10Z" stroke="url(#nesticGradient)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M30 10L52 22V38L30 50L8 38V22L30 10Z" fill="url(#nesticGradient)" fill-opacity="0.1" />
    <path d="M22 24V36" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 24V36" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 30H38" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="65" y="38" fill="#FFFFFF" style="font: 900 34px sans-serif; letter-spacing: -1.5px;">Host</text>
  <text x="144" y="38" fill="url(#nesticGradient)" style="font: 900 34px sans-serif; letter-spacing: -1.5px;">Nestic</text>
  <text x="66" y="52" fill="#94A3B8" style="font: 800 8.5px sans-serif; letter-spacing: 2.2px;">SMART HOSTING DECISIONS</text>
