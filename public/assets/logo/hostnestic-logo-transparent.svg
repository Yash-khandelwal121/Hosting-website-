<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nesticGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feFlood flood-color="white" flood-opacity="0.3" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feFlood flood-color="#3B82F6" flood-opacity="0.5" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Tech Icon -->
  <g filter="url(#blueGlow)">
    <path d="M30 12L50 22V38L30 48L10 38V22L30 12Z" stroke="url(#nesticGradient)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M30 12L50 22V38L30 48L10 38V22L30 12Z" fill="url(#nesticGradient)" fill-opacity="0.1" />
    
    <!-- Inner Server Details -->
    <path d="M22 25V35 M38 25V35 M22 30H38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="27" r="1.2" fill="white" />
    <circle cx="30" cy="33" r="1.2" fill="white" />
  </g>

  <!-- "Host" Text (Bright White with Glow) -->
  <g filter="url(#whiteGlow)">
    <text x="65" y="38" fill="white" style="font: 900 34px 'Inter', system-ui, sans-serif; letter-spacing: -0.5px;">Host</text>
  </g>

  <!-- "Nestic" Text (Blue Neon Gradient with Glow) -->
  <g filter="url(#blueGlow)">
    <text x="144" y="38" fill="url(#nesticGradient)" style="font: 900 34px 'Inter', system-ui, sans-serif; letter-spacing: -0.5px;">Nestic</text>
  </g>
  
  <!-- Tagline -->
  <text x="66" y="52" fill="#94A3B8" style="font: 800 8.5px 'Inter', system-ui, sans-serif; letter-spacing: 2.2px; text-transform: uppercase;">Smart Hosting Decisions</text>
</svg>
